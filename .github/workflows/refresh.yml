name: Weekly BTS refresh
on:
  schedule:
    # Monday 10:17 UTC = Monday 06:17 America/La_Paz.
    - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bts-production-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BTS_SOURCE_URL: ${{ vars.BTS_SOURCE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing DATABASE_URL secret'; exit 1; }
          test -n "$BTS_SOURCE_URL" || { echo 'Missing BTS_SOURCE_URL variable'; exit 1; }
      - name: Refresh Supabase traffic and report view
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BTS_SOURCE_URL: ${{ vars.BTS_SOURCE_URL }}
          BTS_SOURCE_YEAR: ${{ vars.BTS_SOURCE_YEAR || '2025' }}
        run: python src/refresh.py