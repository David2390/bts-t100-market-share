name: Weekly BTS refresh
on:
  schedule:
    - cron: '17 10 * * 1' # Monday 06:17 America/La_Paz
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bts-production-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Download published 2025 and 2026 exports
        run: python src/download_bts.py
      - name: Validate and transform to Parquet and star schema
        run: python src/build_model.py
      - name: Store versioned Parquet in private Supabase Storage
        env:
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: python src/upload_parquet.py
      - name: Publish validated reporting model atomically
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/load_model.py
      - name: Retain compressed datasets and quality report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bts-parquet-${{ github.run_id }}
          path: |
            data/parquet/
            reports/data-quality.json
          retention-days: 30